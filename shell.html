<title>Hexhaven</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="./hex-board.js"></script>

<!-- the island: always mounted, behind everything -->
<hex-board id="board3d"></hex-board>

<!-- ============ LOADING ============ -->
<section class="scrn sc-loading" id="sc-loading">
  <svg class="crest" width="58" height="58" viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="none" stroke="#e0b15e" stroke-width="3"/>
    <polygon points="50,20 76,35 76,65 50,80 24,65 24,35" fill="#12233a" stroke="#e0b15e" stroke-width="1.5"/>
    <path d="M 38 58 L 38 46 L 50 36 L 62 46 L 62 58 Z" fill="#e0b15e"/>
  </svg>
  <div class="wordmark load-word">HEX<em>HAVEN</em></div>
  <div class="loadbar"><i id="load-bar"></i></div>
  <div class="load-status" id="load-status">Waking the engine</div>
</section>

<!-- ============ MENU ============ -->
<section class="scrn sc-menu" id="sc-menu">
  <div class="menu-col">
    <svg class="crest" width="44" height="44" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="none" stroke="#e0b15e" stroke-width="3"/>
      <polygon points="50,20 76,35 76,65 50,80 24,65 24,35" fill="#12233a" stroke="#e0b15e" stroke-width="1.5"/>
      <path d="M 38 58 L 38 46 L 50 36 L 62 46 L 62 58 Z" fill="#e0b15e"/>
    </svg>
    <h1 class="wordmark menu-word">HEX<em>HAVEN</em></h1>
    <div class="tagline">Settle · Trade · Build</div>
    <div class="menu-actions">
      <button class="btn primary" id="btn-new">New game</button>
      <button class="btn" id="btn-continue">Continue</button>
      <button class="btn" id="btn-settings">Settings</button>
      <button class="btn ghost" id="btn-rules">How to play</button>
    </div>
    <p class="menu-note">Drag the island to look around. Games save automatically.</p>
  </div>
</section>

<!-- ============ SETUP ============ -->
<section class="scrn sc-setup" id="sc-setup">
  <div class="setup-card glass">
    <div class="setup-head">
      <div class="setup-title">Set up your table</div>
      <div class="setup-sub" id="setup-sub">Then deal yourself in.</div>
    </div>
    <div class="setup-body" id="setup-body"></div>
    <div class="setup-foot">
      <button class="btn ghost" id="setup-back">Back</button>
      <button class="btn primary" id="setup-go">Start game</button>
    </div>
  </div>
</section>

<!-- ============ GAME CHROME ============ -->
<section class="scrn sc-game" id="sc-game">

  <!-- top rail: turn banner (left) · rivals (right, column on desktop) · menu -->
  <div class="topbar" id="g-header">
    <div class="turnbar glass" id="turnflag" aria-live="polite"></div>
    <div class="rivals" id="opponents"></div>
    <span class="spacer"></span>
    <button class="iconbtn glass" id="g-menu" aria-label="Menu" title="Menu" data-ico="menu"></button>
  </div>

  <!-- game menu popover -->
  <div class="popover glass" id="gamemenu" hidden>
    <button class="pop-item" id="btn-new-island">New island</button>
    <button class="pop-item" id="btn-recenter">Recenter view</button>
    <button class="pop-item" id="btn-hide">Focus mode</button>
    <button class="pop-item" id="btn-rules-g">How to play</button>
    <div class="pop-sep"></div>
    <button class="pop-item" id="btn-tomenu">Main menu</button>
  </div>

  <!-- chronicle: event feed (3 lines on desktop, a one-line ticker on phones) -->
  <div class="chronicle glass" id="log" aria-live="polite" title="Show the full log"></div>

  <!-- personal notices: what you gained, what was taken -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- big dice, centred over the free area while they tumble -->
  <div class="dice-stage" id="dicebox" aria-hidden="true"></div>

  <!-- contextual instruction + cancel for placement modes -->
  <div class="hint-pill" id="hint"><span id="hint-text">Welcome to the island</span><button class="hint-x" id="hint-cancel" hidden>Cancel</button></div>

  <!-- development cards in hand -->
  <div class="popover devpop glass" id="devpop" hidden></div>

  <!-- bottom command bar -->
  <div class="cmdbar glass" id="dock">
    <button class="dock-handle" id="dock-handle" aria-label="Drag to collapse or expand"><span></span></button>
    <div class="bar-me" id="bar-vp"></div>
    <div class="hand" id="hand"></div>
    <!-- build actions: inline on wide screens, a tray above the bar on narrow ones -->
    <div class="buildpop" id="buildpop" hidden>
      <div class="bp-id" id="me-line"></div>
      <div class="build-grid">
        <button class="act" id="act-road" title="Road (1)"><span class="ic" data-ico="road"></span><span class="al">Road</span><span class="cost" data-cost="road"></span></button>
        <button class="act" id="act-sett" title="Settlement (2)"><span class="ic" data-ico="house"></span><span class="al">Settle</span><span class="cost" data-cost="sett"></span></button>
        <button class="act" id="act-city" title="City (3)"><span class="ic" data-ico="city"></span><span class="al">City</span><span class="cost" data-cost="city"></span></button>
        <button class="act" id="act-dev" title="Development card (4)"><span class="ic" data-ico="scroll"></span><span class="al">Card</span><span class="cost" data-cost="dev"></span></button>
        <button class="act" id="act-ship" style="display:none"><span class="ic" data-ico="ship"></span><span class="al">Ship</span><span class="cost" data-cost="ship"></span></button>
      </div>
    </div>
    <div class="bar-acts">
      <button class="btn build" id="btn-build" title="Build (B)"><span data-ico="house"></span><span class="bl">Build</span></button>
      <button class="btn" id="btn-trade" title="Trade (T)"><span data-ico="trade"></span><span class="bl">Trade</span></button>
      <button class="btn primary go" id="btn-roll" title="Roll dice (Space)"></button>
      <button class="btn primary go" id="btn-end" title="End turn (Space)" hidden>End turn</button>
    </div>
  </div>
</section>

<!-- ============ MODAL SHEET ============ -->
<div id="overlay"><div class="sheet glass" id="sheet"></div></div>
