<title>Hexhaven</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<div id="app">

  <!-- ======= MENU ======= -->
  <section class="screen" id="menu">
    <svg class="crest" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="none" stroke="#e0b15e" stroke-width="3"/>
      <polygon points="50,20 76,35 76,65 50,80 24,65 24,35" fill="#12233a" stroke="#e0b15e" stroke-width="1.5"/>
      <path d="M 38 58 L 38 46 L 50 36 L 62 46 L 62 58 Z" fill="#e0b15e"/>
    </svg>
    <h1 class="title">HEX<em>HAVEN</em></h1>
    <div class="tagline">Settle · Trade · Build</div>
    <div class="menu-actions">
      <button class="btn primary" id="btn-new">New game</button>
      <button class="btn" id="btn-continue">Continue</button>
      <button class="btn" id="btn-settings">Settings</button>
      <button class="btn ghost" id="btn-rules">How to play</button>
    </div>
    <p class="menu-note">Tip: open this page in your phone's browser and use <b>Share → Add&nbsp;to&nbsp;Home&nbsp;Screen</b> to keep it as an app. Games save automatically.</p>
  </section>

  <!-- ======= GAME ======= -->
  <section class="screen" id="game">
    <div class="topbar">
      <span class="title-sm">HEX<em>HAVEN</em></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="g-settings" aria-label="Settings" data-ico="gear"></button>
      <button class="iconbtn" id="g-menu" aria-label="Menu" data-ico="menu"></button>
    </div>

    <div id="opponents"></div>

    <div id="boardwrap">
      <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="dicebox"></div>
      <div id="turnflag"></div>
      <div id="hint">Welcome to the island</div>
    </div>

    <div class="rightcol">
      <div id="dock">
        <div class="dock-top" id="me-line"></div>
        <div id="hand"></div>
        <div class="actions">
          <button class="act" id="act-road"><span class="ic" data-ico="road"></span>Road<span class="cost" data-cost="road"></span></button>
          <button class="act" id="act-sett"><span class="ic" data-ico="house"></span>Settle<span class="cost" data-cost="sett"></span></button>
          <button class="act" id="act-city"><span class="ic" data-ico="city"></span>City<span class="cost" data-cost="city"></span></button>
          <button class="act" id="act-dev"><span class="ic" data-ico="scroll"></span>Dev card<span class="cost" data-cost="dev"></span></button>
        </div>
        <div class="bigrow">
          <button class="btn primary" id="btn-roll"><span data-ico="die"></span> Roll dice</button>
          <button class="btn" id="btn-trade"><span data-ico="trade"></span> Trade</button>
          <button class="btn ghost" id="btn-end">End turn</button>
        </div>
      </div>
      <div id="log" aria-live="polite"></div>
    </div>
  </section>
</div>

<!-- ======= MODAL ======= -->
<div id="overlay"><div class="sheet" id="sheet"></div></div>
