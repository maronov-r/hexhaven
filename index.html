<title>Hexhaven</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="./hex-board.js"></script>

<!-- the island: always mounted, behind everything -->
<hex-board id="board3d"></hex-board>

<!-- ============ LOADING ============ -->
<section class="scrn sc-loading" id="sc-loading">
  <svg class="crest" width="58" height="58" viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="none" stroke="#e0b15e" stroke-width="3"/>
    <polygon points="50,20 76,35 76,65 50,80 24,65 24,35" fill="#12233a" stroke="#e0b15e" stroke-width="1.5"/>
    <path d="M 38 58 L 38 46 L 50 36 L 62 46 L 62 58 Z" fill="#e0b15e"/>
  </svg>
  <div class="wordmark load-word">HEX<em>HAVEN</em></div>
  <div class="loadbar"><i id="load-bar"></i></div>
  <div class="load-status" id="load-status">Waking the engine</div>
</section>

<!-- ============ MENU ============ -->
<section class="scrn sc-menu" id="sc-menu">
  <div class="menu-col">
    <svg class="crest" width="44" height="44" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,4 90,27 90,73 50,96 10,73 10,27" fill="none" stroke="#e0b15e" stroke-width="3"/>
      <polygon points="50,20 76,35 76,65 50,80 24,65 24,35" fill="#12233a" stroke="#e0b15e" stroke-width="1.5"/>
      <path d="M 38 58 L 38 46 L 50 36 L 62 46 L 62 58 Z" fill="#e0b15e"/>
    </svg>
    <h1 class="wordmark menu-word">HEX<em>HAVEN</em></h1>
    <div class="tagline">Settle · Trade · Build</div>
    <div class="menu-actions">
      <button class="btn primary" id="btn-new">New game</button>
      <button class="btn" id="btn-continue">Continue</button>
      <button class="btn" id="btn-settings">Settings</button>
      <button class="btn ghost" id="btn-rules">How to play</button>
    </div>
    <p class="menu-note">Drag the island to look around. Games save automatically.</p>
  </div>
</section>

<!-- ============ SETUP ============ -->
<section class="scrn sc-setup" id="sc-setup">
  <div class="setup-card glass">
    <div class="setup-head">
      <div class="setup-title">Set up your table</div>
      <div class="setup-sub" id="setup-sub">Then deal yourself in.</div>
    </div>
    <div class="setup-body" id="setup-body"></div>
    <div class="setup-foot">
      <button class="btn ghost" id="setup-back">Back</button>
      <button class="btn primary" id="setup-go">Start game</button>
    </div>
  </div>
</section>

<!-- ============ GAME CHROME ============ -->
<section class="scrn sc-game" id="sc-game">

  <!-- minimal top bar: turn + rivals + menu -->
  <div class="topbar" id="g-header">
    <div class="turn-pill glass" id="turnflag"></div>
    <div class="rival-strip" id="opponents"></div>
    <span class="spacer"></span>
    <button class="iconbtn glass" id="g-menu" aria-label="Menu" data-ico="menu"></button>
  </div>

  <!-- game menu popover -->
  <div class="popover glass" id="gamemenu" hidden>
    <button class="pop-item" id="btn-new-island">New island</button>
    <button class="pop-item" id="btn-rules-g">How to play</button>
    <button class="pop-item" id="btn-hide">Focus mode</button>
    <div class="pop-sep"></div>
    <button class="pop-item" id="btn-tomenu">Main menu</button>
  </div>

  <!-- self-fading chronicle -->
  <div class="chronicle glass" id="log" aria-live="polite"></div>

  <!-- hint pill -->
  <div class="hint-pill" id="hint">Welcome to the island</div>

  <!-- dice -->
  <div class="dice-panel glass" id="dicebox"></div>

  <!-- build popover (opens above the bar) -->
  <div class="buildpop glass" id="buildpop" hidden>
    <div class="bp-id" id="me-line"></div>
    <div class="build-grid">
      <button class="act" id="act-road"><span class="ic" data-ico="road"></span><span class="al">Road</span><span class="cost" data-cost="road"></span></button>
      <button class="act" id="act-sett"><span class="ic" data-ico="house"></span><span class="al">Settle</span><span class="cost" data-cost="sett"></span></button>
      <button class="act" id="act-city"><span class="ic" data-ico="city"></span><span class="al">City</span><span class="cost" data-cost="city"></span></button>
      <button class="act" id="act-dev"><span class="ic" data-ico="scroll"></span><span class="al">Dev card</span><span class="cost" data-cost="dev"></span></button>
      <button class="act" id="act-ship" style="display:none"><span class="ic" data-ico="ship"></span><span class="al">Ship</span><span class="cost" data-cost="ship"></span></button>
    </div>
    <!-- #devwrap is inserted here by renderDock -->
  </div>

  <!-- bottom command bar -->
  <div class="cmdbar glass" id="dock">
    <button class="dock-handle" id="dock-handle" aria-label="Drag to collapse or expand"><span></span></button>
    <span class="bar-vp num" id="bar-vp"></span>
    <div class="hand" id="hand"></div>
    <div class="bar-acts">
      <button class="btn build" id="btn-build"><span data-ico="house"></span> Build</button>
      <button class="btn" id="btn-trade"><span data-ico="coins"></span> Trade</button>
      <button class="btn primary" id="btn-roll"><span data-ico="die"></span> Roll</button>
      <button class="btn ghost" id="btn-end">End</button>
    </div>
  </div>
</section>

<!-- ============ MODAL SHEET ============ -->
<div id="overlay"><div class="sheet glass" id="sheet"></div></div>
<style>
/* ============ HEXHAVEN — night-sea table ============ */
:root{
  --sea0:#081019; --sea1:#0d1b2a; --panel:#12233a; --panel2:#0f1e33;
  --line:rgba(154,190,225,.14); --line2:rgba(154,190,225,.28);
  --ink:#eae4d3; --dim:#9fb0c2; --faint:#6b7d92;
  --brass:#e0b15e; --brass-hi:#f0c778; --brass-ink:#231a09;
  --good:#7fc98a; --bad:#e07070;
  --wood:#2f6b45; --brick:#c4633f; --sheep:#8fbf6a; --wheat:#e2b84b; --ore:#7c8ca6; --desert:#c9b48a;
  --p0:#e0555a; --p1:#4c9ee3; --p2:#e8e4d8; --p3:#e58f3c;
  --disp:"Yeseva One","Iowan Old Style","Palatino Nova",Palatino,Georgia,serif;
  --sans:"Mulish",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  min-height:100%;background:var(--sea0);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.45;overscroll-behavior:none;
  background-image:radial-gradient(1200px 700px at 50% -10%,rgba(76,158,227,.10),transparent 60%),
    radial-gradient(900px 500px at 90% 110%,rgba(224,177,94,.05),transparent 60%);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input,select{font-family:inherit;font-size:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}

/* ================= 3D SHELL LAYOUT ================= */
#board3d{position:fixed;inset:0;z-index:0;display:block;
  background:radial-gradient(ellipse at 50% 46%,#14293f 0%,#0b1725 58%,#070e17 100%)}
.spacer{flex:1}
.dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.3) inset}
.wordmark{font-family:var(--disp);letter-spacing:.14em;line-height:1;white-space:nowrap}
.wordmark em{font-style:normal;color:var(--brass)}
.crest{filter:drop-shadow(0 6px 18px rgba(224,177,94,.25));flex:none}
.glass{background:rgba(13,27,42,.74);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.42)}

/* buttons (carried) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:11px;
  font-weight:600;font-size:15px;background:var(--panel);border:1px solid var(--line2);
  transition:transform .12s,background .15s,border-color .15s,filter .15s}
.btn:hover{background:#17304e;border-color:var(--brass)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:var(--brass-ink);border-color:transparent;box-shadow:0 6px 20px rgba(224,177,94,.28)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--dim)}
.btn:disabled{opacity:.4;pointer-events:none}
.iconbtn{width:32px;height:32px;border-radius:9px;background:var(--panel);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover{border-color:var(--brass)}

/* screen visibility */
.scrn{display:none}
body[data-screen=loading] .sc-loading{display:flex}
body[data-screen=menu] .sc-menu{display:flex}
body[data-screen=setup] .sc-setup{display:flex}
body[data-screen=game] .sc-game{display:block}

/* ---- loading ---- */
.sc-loading{position:fixed;inset:0;z-index:9;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:radial-gradient(ellipse at 50% 45%,#12263c 0%,#0a1523 58%,#070e17 100%)}
.load-word{font-size:26px;letter-spacing:.22em}
.loadbar{width:212px;height:3px;border-radius:2px;background:rgba(154,190,225,.16);overflow:hidden}
.loadbar i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#e0b15e,#f0c778);
  transition:width .5s cubic-bezier(.2,.9,.25,1)}
.load-status{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
@keyframes hh-breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.07);opacity:1}}
.sc-loading .crest{animation:hh-breathe 2.6s ease-in-out infinite}

/* ---- menu ---- */
.sc-menu{position:fixed;inset:0;z-index:8;align-items:center;
  background:linear-gradient(to right,rgba(7,14,23,.95) 0%,rgba(7,14,23,.82) 34%,rgba(7,14,23,.34) 62%,rgba(7,14,23,0) 100%);
  padding-left:min(74px,7vw)}
@keyframes hh-rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.menu-col{display:flex;flex-direction:column;gap:16px;max-width:330px;animation:hh-rise .55s cubic-bezier(.2,.9,.25,1)}
.menu-word{font-size:40px;letter-spacing:.15em}
.tagline{color:var(--brass);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase}
.menu-actions{display:flex;flex-direction:column;gap:8px;width:250px;max-width:100%}
.menu-actions .btn{padding:12px 18px;border-radius:11px}
.menu-note{color:#5d6e82;font-size:11px;line-height:1.55;max-width:290px}

/* ---- setup / rules cards ---- */
.sc-setup{position:fixed;inset:0;z-index:8;align-items:center;
  background:linear-gradient(to right,rgba(7,14,23,.96) 0%,rgba(7,14,23,.88) 34%,rgba(7,14,23,.4) 62%,rgba(7,14,23,0) 100%);
  padding-left:min(74px,7vw)}
.setup-card{width:396px;max-width:calc(100vw - 28px);max-height:86vh;display:flex;flex-direction:column;
  border-radius:16px;box-shadow:0 22px 54px rgba(0,0,0,.5);animation:hh-rise .45s cubic-bezier(.2,.9,.25,1)}
.setup-head{flex:none;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.setup-title{font-family:var(--disp);font-size:21px;letter-spacing:.02em}
.setup-sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.setup-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.setup-foot{flex:none;display:flex;gap:9px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.setup-foot .primary{flex:1}
.field-lab{font-size:11.5px;color:var(--dim);margin-bottom:6px}
.field-lab small{display:block;color:#5d6e82;font-size:10.5px;margin-top:2px;font-weight:400}
.seg{display:flex;gap:5px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--dim);
  background:var(--panel);border:1px solid var(--line2)}
.seg button.on{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:38px;height:30px;border-radius:8px;border:2px solid rgba(154,190,225,.2)}
.swatch.on{border-color:var(--brass)}
input[type=text]{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;width:100%}

/* ================= GAME CHROME (board-first) ================= */
.sc-game{position:fixed;inset:0;z-index:2;pointer-events:none}
.sc-game>*{pointer-events:auto}

/* minimal top bar — transparent rail; only the pills catch the pointer */
.topbar{position:absolute;top:10px;left:12px;right:12px;z-index:3;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.turn-pill{display:flex;align-items:center;gap:8px;border-radius:99px;padding:6px 13px 6px 10px;font-size:12.5px;white-space:nowrap;flex:none}
.turn-pill .st{color:var(--faint);font-size:11px}
.iconbtn{flex:none}

/* game menu popover */
.popover{position:absolute;z-index:6;min-width:172px;padding:6px;display:flex;flex-direction:column;gap:2px;border-radius:12px}
.popover[hidden]{display:none}
#gamemenu{top:50px;right:12px}
.pop-item{text-align:left;padding:9px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink);background:transparent}
.pop-item:hover{background:var(--panel)}
.pop-sep{height:1px;background:var(--line);margin:3px 4px}

/* chronicle */
.chronicle{position:absolute;left:12px;top:52px;width:236px;max-height:96px;overflow-y:auto;z-index:2;
  padding:8px 10px;display:flex;flex-direction:column;gap:4px;border-radius:12px;cursor:pointer;
  background:rgba(13,27,42,.4);border:1px solid rgba(154,190,225,.08);
  transition:opacity .7s ease,max-height .35s ease,background .35s ease}
.chronicle.open{max-height:320px;background:rgba(13,27,42,.82);border-color:var(--line2)}
.chronicle.idle{opacity:.16}
.chronicle .l{font-size:11.5px;line-height:1.4;color:var(--dim)}
.chronicle .l.sys{color:var(--brass)}
.chronicle .l b{color:var(--ink)}
.chronicle:not(.open) .l:nth-child(2){opacity:.55}
.chronicle:not(.open) .l:nth-child(3){opacity:.3}
.chronicle:not(.open) .l:nth-child(n+4){display:none}

/* hint pill */
.hint-pill{position:absolute;top:54px;left:50%;transform:translateX(-50%);z-index:1;
  padding:7px 15px;border-radius:99px;background:rgba(13,27,42,.82);border:1px solid var(--line2);
  font-size:12px;color:var(--dim);pointer-events:none;white-space:nowrap;max-width:66vw;overflow:hidden;text-overflow:ellipsis;
  backdrop-filter:blur(6px);transition:opacity .2s}
.hint-pill.hide{opacity:0}
.hint-pill.warn{color:#ff9a9a;background:rgba(48,16,18,.92);border-color:rgba(224,112,112,.65);font-weight:600}
@keyframes hh-shake{0%,100%{transform:translateX(-50%)}20%{transform:translateX(calc(-50% - 6px))}40%{transform:translateX(calc(-50% + 6px))}60%{transform:translateX(calc(-50% - 4px))}80%{transform:translateX(calc(-50% + 4px))}}
.hint-pill.shake{animation:hh-shake .38s ease}

/* rival chips (in the top bar) */
.rival-strip{display:flex;gap:6px;flex:1;min-width:0;overflow:visible}
.rival{padding:6px 10px;border-radius:99px;background:rgba(13,27,42,.72);
  backdrop-filter:blur(14px);border:1px solid var(--line);border-left:3px solid var(--pc,#888);
  box-shadow:0 8px 20px rgba(0,0,0,.34);opacity:.7;transition:opacity .2s;flex:none}
.rival.active{opacity:1;border-color:rgba(224,177,94,.5)}
.rival .rtop{display:flex;align-items:center;gap:6px}
.rival .name{font-weight:600;font-size:12px;white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.rival .vp{font-family:var(--disp);font-size:16px;color:var(--brass);flex:none}
.rival .meta{display:none;gap:8px;color:var(--dim);font-size:10.5px;margin-top:4px}
.rival .meta b{color:var(--ink);font-weight:600}
.rival .rbadge{color:var(--brass);font-weight:600}
.rival:hover,.rival.active{border-radius:12px}
.rival:hover .meta,.rival.active .meta{display:flex}

/* dice */
.dice-panel{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);z-index:2;
  display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:14px;background:rgba(13,27,42,.78)}
.dice-panel:empty{display:none}
.die{width:36px;height:36px;border-radius:8px;background:#eae4d3;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.45);transition:transform .12s}
.die svg{display:block}
.die.rolling{animation:hh-tumble .5s ease-out}
@keyframes hh-tumble{0%{transform:rotate(0) scale(1)}35%{transform:rotate(-15deg) scale(1.12)}70%{transform:rotate(11deg) scale(1.05)}100%{transform:rotate(0) scale(1)}}
.dtotal{font-family:var(--disp);font-size:19px;color:var(--brass);border-left:1px solid var(--line2);padding-left:10px}

/* ---- bottom command bar ---- */
.cmdbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;
  width:min(940px,calc(100vw - 24px));display:flex;align-items:center;gap:12px;padding:9px 12px}
.cmdbar.active{border-color:rgba(224,177,94,.5)}
.bar-vp{font-family:var(--disp);font-size:19px;color:var(--brass);flex:none;padding:0 4px 0 2px;white-space:nowrap}
.bar-acts{display:flex;gap:7px;flex:none;margin-left:auto}
.bar-acts .btn{padding:10px 15px;font-size:13.5px;border-radius:10px}
.bar-acts .btn.build.on{background:var(--brass);color:var(--brass-ink);border-color:transparent}

/* resource hand — compact pills in the bar */
.hand{display:flex;gap:6px;flex:1;min-width:0;justify-content:center}
@keyframes hh-deal{from{opacity:0;transform:translateY(34px) rotate(8deg) scale(.88)}to{opacity:1;transform:none}}
@keyframes hh-bump{0%{box-shadow:0 0 0 0 rgba(224,177,94,0)}30%{box-shadow:0 0 0 10px rgba(224,177,94,.9)}100%{box-shadow:0 0 0 0 rgba(224,177,94,0)}}
.rescard{flex:0 1 62px;min-width:44px;height:54px;border-radius:10px;overflow:hidden;position:relative;display:flex;
  align-items:center;justify-content:center;gap:6px;padding:0 6px;
  background:linear-gradient(165deg,#16293f,#0b1728);border:1px solid var(--line2);
  transition:transform .18s cubic-bezier(.2,.9,.25,1),border-color .18s}
.rescard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--rc,#888)}
.rescard .ic{opacity:.9;flex:none}.rescard .ic svg{display:block}
.rescard .ct{font-family:var(--disp);font-size:23px;color:var(--ink);line-height:1}
.rescard .lb{display:none}
.rescard.zero{opacity:.4}
.rescard:hover{transform:translateY(-6px);border-color:var(--brass)}
.rescard.bump{animation:hh-bump 1s ease-out}

/* ---- build popover (opens above the bar) ---- */
.buildpop{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);z-index:5;
  width:min(560px,calc(100vw - 24px));padding:12px 14px;display:flex;flex-direction:column;gap:11px}
.buildpop[hidden]{display:none}
.bp-id{display:flex;align-items:center;gap:8px}
.me-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px}
.me-vp{font-family:var(--disp);font-size:18px;color:var(--brass)}
.me-stats{color:var(--dim);font-size:11px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.me-stats b{color:var(--ink)}
.build-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.act{display:flex;align-items:center;gap:8px;padding:10px 11px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;transition:transform .15s,border-color .15s,background .15s}
.act .al{flex:1;text-align:left}
.act .cost{display:flex;gap:3px;align-items:center}
.act:not(.off):hover{border-color:var(--brass);transform:translateY(-2px)}
.act.off{opacity:.5;cursor:default}
.act:disabled{opacity:.45;transform:none}
.act.on{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.cdot{display:inline-block;width:9px;height:9px;border-radius:2.5px;box-shadow:0 0 0 1px rgba(0,0,0,.35) inset}
.sec-lab{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:-2px}
.devwrap{display:flex;flex-direction:column;gap:6px}
.devchip{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;text-align:left;
  background:linear-gradient(165deg,#2a2413,#16130a);border:1px solid rgba(224,177,94,.4);color:#f0c778}
.devchip .dlab{font-family:var(--disp);font-size:12.5px}
.devchip .dnote{font-size:10px;color:var(--dim)}
.devchip.playable{cursor:pointer}
.devchip.playable:hover{filter:brightness(1.1)}
.devchip:not(.playable){opacity:.55}

<script>
/* ================= HEXHAVEN ENGINE ================= */
'use strict';

const RES = ['wood','brick','sheep','wheat','ore'];
const RES_META = {
  wood:{label:'Lumber', ic:'🌲', col:'#3e7c4f', tile:'#2f6b45'},
  brick:{label:'Brick', ic:'🧱', col:'#c4633f', tile:'#a9553a'},
  sheep:{label:'Wool',  ic:'🐑', col:'#8fbf6a', tile:'#7fae53'},
  wheat:{label:'Grain', ic:'🌾', col:'#e2b84b', tile:'#d0a53a'},
  ore:{label:'Ore',   ic:'⛰️', col:'#7c8ca6', tile:'#6b7a94'},
};
const DESERT_TILE = '#c9b48a';
const COST = {
  road:{wood:1,brick:1},
  ship:{wood:1,sheep:1},
  sett:{wood:1,brick:1,sheep:1,wheat:1},
  city:{wheat:2,ore:3},
  dev:{sheep:1,wheat:1,ore:1},
};
const DEV_META = {
  knight:{label:'Knight', ic:'⚔️', desc:'Move the robber and steal 1 card.'},
  vp:{label:'Victory Point', ic:'🏵️', desc:'Worth 1 VP, kept hidden.'},
  road:{label:'Road Building', ic:'🛤️', desc:'Build 2 roads for free.'},
  plenty:{label:'Year of Plenty', ic:'🎁', desc:'Take any 2 resources from the bank.'},
  mono:{label:'Monopoly', ic:'💰', desc:'All players give you every card of one resource.'},
};
const PLAYER_COLORS = [
  {id:'crimson', hex:'#e0555a'},
  {id:'azure',   hex:'#4c9ee3'},
  {id:'ivory',   hex:'#e8e4d8'},
  {id:'amber',   hex:'#e58f3c'},
  {id:'teal',    hex:'#3bb6a6'},
  {id:'violet',  hex:'#9b6ee0'},
  {id:'rose',    hex:'#e05ea6'},
  {id:'lime',    hex:'#86c447'},
];
const BOT_NAMES = ['Bruna','Otto','Sable','Wren','Idris','Marta'];
const PIPS = {2:1,3:2,4:3,5:4,6:5,8:5,9:4,10:3,11:2,12:1};

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const clone = o => JSON.parse(JSON.stringify(o));
const sum = o => Object.values(o).reduce((a,b)=>a+b,0);
const handSize = p => sum(p.res);

/* ---------------- board generation ---------------- */
const HEX_SIZE = 56;

function hexCorners(cx,cy){
  const pts=[];
  for(let i=0;i<6;i++){
    const ang=Math.PI/180*(60*i-30);
    pts.push([cx+HEX_SIZE*Math.cos(ang), cy+HEX_SIZE*Math.sin(ang)]);
  }
  return pts;
}
const vkey = (x,y)=>Math.round(x)+','+Math.round(y);
const ekey = (a,b)=> a<b ? a+'|'+b : b+'|'+a;

function buildBoard(layout, radius, sea){
  radius = radius || 2;                        // 2=Standard(19) · 3=Large(37) · 4=Huge(61)
  const hexes=[];
  for(let q=-radius;q<=radius;q++) for(let r=-radius;r<=radius;r++){
    if(Math.abs(q+r)<=radius){
      const x=HEX_SIZE*Math.sqrt(3)*(q+r/2), y=HEX_SIZE*1.5*r;
      hexes.push({id:hexes.length,q,r,x,y,terrain:null,num:null});
    }
  }
  // Voyages: the q===0 column becomes a sea channel, splitting the board into two islands
  if(sea){ for(const h of hexes) if(h.q===0){ h.terrain='sea'; h.num=null; } }
  const landHexes=hexes.filter(h=>h.terrain!=='sea');
  const N=landHexes.length;
  // terrain pool — ~1 desert per 19 hexes, resources in the classic 4:4:4:3:3 ratio, scaled
  const deserts=Math.max(1,Math.round(N/19));
  const landN=N-deserts;
  const ratio={wood:4,sheep:4,wheat:4,brick:3,ore:3};
  const counts={}; let assigned=0;
  for(const k of RES){ counts[k]=Math.round(landN*ratio[k]/18); assigned+=counts[k]; }
  for(let i=0; assigned!==landN; i++){ const k=RES[i%RES.length], d=Math.sign(landN-assigned); if(counts[k]+d<0) continue; counts[k]+=d; assigned+=d; }
  const pool=[];
  for(const k of RES) for(let i=0;i<counts[k];i++) pool.push(k);
  for(let i=0;i<deserts;i++) pool.push('desert');
  const terr=shuffle(pool);
  landHexes.forEach((h,i)=>h.terrain=terr[i]);

  // number placement
  const ring = h => (Math.abs(h.q)+Math.abs(h.r)+Math.abs(h.q+h.r))/2;
  const neighborsOf = h => hexes.filter(o=>o!==h && (Math.abs(o.q-h.q)+Math.abs(o.r-h.r)+Math.abs(o.q+o.r-h.q-h.r))/2===1);
  const landCount = hexes.filter(h=>h.terrain!=='desert'&&h.terrain!=='sea').length;
  if(layout==='spiral' && radius===2 && !sea){
    // classic variable setup: numbers laid in a spiral, guarantees no adjacent 6/8
    const seq=[5,2,6,3,8,10,9,12,11,4,8,10,9,4,5,6,3,11];
    const byRing=[2,1,0].map(rr=>hexes.filter(h=>ring(h)===rr)
      .sort((a,b)=>Math.atan2(a.y,a.x)-Math.atan2(b.y,b.x)));
    const order=[...byRing[0],...byRing[1],...byRing[2]];
    let k=0;
    for(const h of order){ if(h.terrain==='desert') continue; h.num=seq[k++]; }
  } else {
    // weighted number bag (Catan frequencies), scaled to the land-hex count
    const W=[[2,1],[3,2],[4,2],[5,2],[6,2],[8,2],[9,2],[10,2],[11,2],[12,1]];
    const base=[]; for(const [n,w] of W) for(let i=0;i<w;i++) base.push(n);
    const makeBag=()=>{ const bag=[]; while(bag.length<landCount) bag.push(...shuffle(base)); return shuffle(bag).slice(0,landCount); };
    for(let attempt=0;attempt<400;attempt++){
      const bag=makeBag(); let k=0;
      hexes.forEach(h=>{ h.num = (h.terrain==='desert'||h.terrain==='sea')?null:bag[k++]; });
      if(layout!=='balanced') break;
      const bad = hexes.some(h=>(h.num===6||h.num===8) && neighborsOf(h).some(n=>n.num===6||n.num===8));
      if(!bad) break;
    }
  }

  // vertices & edges
  const V={}, E={};
  for(const h of hexes){
    const cs=hexCorners(h.x,h.y);
    const keys=cs.map(([x,y])=>vkey(x,y));
    cs.forEach(([x,y],i)=>{
      const k=keys[i];
      if(!V[k]) V[k]={k,x,y,hexes:[],adj:[],edges:[],bld:null,port:null};
      V[k].hexes.push(h.id);
    });
    for(let i=0;i<6;i++){
      const a=keys[i], b=keys[(i+1)%6], ek=ekey(a,b);
      if(!E[ek]) E[ek]={k:ek,a,b,hexes:[],road:null,ship:null};
      E[ek].hexes.push(h.id);
    }
  }
  for(const e of Object.values(E)){
    if(!V[e.a].adj.includes(e.b)) V[e.a].adj.push(e.b);
    if(!V[e.b].adj.includes(e.a)) V[e.b].adj.push(e.a);
    V[e.a].edges.push(e.k); V[e.b].edges.push(e.k);
  }

  // ports: walk the coastal edge cycle, drop harbours around it (land coast only)
  const coast = Object.values(E).filter(e=>e.hexes.length===1 && hexes[e.hexes[0]].terrain!=='sea');
  const chain=[coast[0]]; const used=new Set([coast[0].k]);
  while(chain.length<coast.length){
    const last=chain[chain.length-1];
    const nxt=coast.find(e=>!used.has(e.k)&&(e.a===last.a||e.a===last.b||e.b===last.a||e.b===last.b));
    if(!nxt) break;
    chain.push(nxt); used.add(nxt.k);
  }
  // ~1 harbour per 3.3 coastal edges, evenly spaced; one of each resource then 'any'
  const nPorts=Math.max(4, Math.round(chain.length/3.3));
  const specifics=shuffle(['wood','brick','sheep','wheat','ore']);
  const portTypes=shuffle(Array.from({length:nPorts},(_,i)=> i<specifics.length?specifics[i]:'any'));
  const ports=[];
  for(let i=0;i<nPorts;i++){
    const e=chain[Math.round(i*chain.length/nPorts)];
    if(!e) continue;
    const t=portTypes[i];
    V[e.a].port=t; V[e.b].port=t;
    ports.push({edge:e.k,type:t});
  }

  const desert=hexes.find(h=>h.terrain==='desert');
  return {hexes,V,E,ports,robber:desert.id};
}

/* ---------------- game state ---------------- */
function newGame(settings){
  const n=settings.bots+1;
  // scale the bank and dev deck to the board so bigger maps don't run dry
  const _rad=settings.mapSize||2, _N=1+3*_rad*(_rad+1), _land=_N-Math.max(1,Math.round(_N/19));
  const bankN=Math.max(19,Math.round(19*_land/18));
  const devMul=Math.max(1,Math.round(_land/18));
  const colors=PLAYER_COLORS.slice();
  const me=colors.splice(settings.colorIdx,1)[0];
  const botCols=shuffle(colors).slice(0,settings.bots);
  const botNames=shuffle(BOT_NAMES).slice(0,settings.bots);
  const players=[{i:0,name:settings.name||'You',color:me.hex,bot:false}];
  for(let b=0;b<settings.bots;b++)
    players.push({i:b+1,name:botNames[b],color:botCols[b].hex,bot:true});
  for(const p of players){
    p.res={wood:0,brick:0,sheep:0,wheat:0,ore:0};
    p.dev=[]; p.newdev=[]; p.knights=0; p.devVp=0;
    p.stock={road:15,sett:5,city:4,ship:15};
    p.playedDevThisTurn=false;
  }
  const devDeck=shuffle([
    ...Array(14*devMul).fill('knight'), ...Array(5*devMul).fill('vp'),
    ...Array(2*devMul).fill('road'), ...Array(2*devMul).fill('plenty'), ...Array(2*devMul).fill('mono'),
  ]);
  const order = shuffle(players.map(p=>p.i));
  const S={
    settings, players, board:buildBoard(settings.layout, settings.mapSize, settings.expSea),
    bank:{wood:bankN,brick:bankN,sheep:bankN,wheat:bankN,ore:bankN}, devDeck,
    order, turnPtr:0,
    phase:'setup',
    setupQueue:[...order, ...order.slice().reverse()],
    setupStep:'sett', lastSetupSett:null,
    dice:null, rolled:false,
    longestRoad:{owner:null,len:0}, largestArmy:{owner:null,size:0},
    discardQueue:[], pendingSteal:null, freeRoads:0,
    winner:null, log:[],
  };
  if(settings.expSea) S.hasSea=true;
  if(settings.expWild) applyWildExpansion(S);
  return S;
}

/* ---------- expansion: wild terrains (guarded by settings.expWild) ---------- */
// A hex names its 3D model via h.art while the engine keeps paying out on h.terrain.
// 'gold' is a real new terrain (pays a wild); 'jungle' is art-only over wood (pays lumber).
function applyWildExpansion(S){
  const pick=a=>a.length?a[Math.floor(Math.random()*a.length)]:null;
  const take=f=>pick(S.board.hexes.filter(h=>h.terrain!=='desert'&&!h.art&&!h.site&&f(h)));
  // Gold Field — the one genuinely new terrain (pays a wild)
  const g=take(h=>h.num&&h.num!==6&&h.num!==8); if(g){ g.terrain='gold'; g.art='gold'; }
  // art reskins over their matching resource — still produce that resource
  const j=take(h=>h.terrain==='wood');  if(j) j.art='jungle';
  const o=take(h=>h.terrain==='wheat'); if(o) o.art='oasis';
  const w=take(h=>h.terrain==='brick'); if(w) w.art='swamp';
  const v=take(h=>h.terrain==='ore');   if(v){ v.art='volcano'; v.volcano=true; }
  // Wonders — art over a producer plus a one-tile effect
  const tp=take(h=>h.num); if(tp){ tp.art='tradepost'; tp.site='tradepost'; S.hasTradepost=true; }
  const ru=take(h=>h.num); if(ru){ ru.art='ruins';     ru.site='ruins';     ru.claimedBy=null; }
  const mo=take(h=>h.num); if(mo){ mo.art='monument';  mo.site='monument';  mo.claimedBy=null; S.hasMonument=true; }
}
// least-held resource the bank can still pay (used for Gold Field's wild payout)
function neediestResource(S,pl){
  let best=null,bv=Infinity;
  for(const r of RES){ if(S.bank[r]<=0) continue; if(pl.res[r]<bv){ bv=pl.res[r]; best=r; } }
  return best;
}
const curP = S => S.phase==='setup' ? S.players[S.setupQueue[0]] : S.players[S.order[S.turnPtr]];

function vp(S,p,includeHidden){
  let v=0;
  for(const vx of Object.values(S.board.V))
    if(vx.bld&&vx.bld.p===p.i) v += vx.bld.type==='city'?2:1;
  if(S.longestRoad.owner===p.i) v+=2;
  if(S.largestArmy.owner===p.i) v+=2;
  if(S.hasMonument){ for(const h of S.board.hexes) if(h.site==='monument'&&h.claimedBy===p.i){ v+=1; break; } }
  if(includeHidden) v+=p.devVp;
  return v;
}
function checkWin(S){
  const p=curP(S);
  if(vp(S,p,true)>=S.settings.target){ S.phase='over'; S.winner=p.i; return true; }
  return false;
}
function log(S,msg,sys){ S.log.push({msg,sys:!!sys}); if(S.log.length>120) S.log.shift(); }

/* ---------------- legality ---------------- */
function canAfford(p,cost){ return Object.entries(cost).every(([r,n])=>p.res[r]>=n); }
function pay(S,p,cost){ for(const [r,n] of Object.entries(cost)){ p.res[r]-=n; S.bank[r]+=n; } }

function settSpots(S,p,setup){
  const out=[];
  for(const v of Object.values(S.board.V)){
    if(v.bld) continue;
    if(v.adj.some(k=>S.board.V[k].bld)) continue; // distance rule
    if(S.hasSea && !v.hexes.some(hid=>S.board.hexes[hid].terrain!=='sea')) continue; // no open-ocean settlements
    if(!setup){
      const connected=v.edges.some(ek=>S.board.E[ek].road===p.i||S.board.E[ek].ship===p.i);
      if(!connected) continue;
    }
    out.push(v.k);
  }
  return out;
}
function roadSpots(S,p,fromVertex){
  const out=[];
  for(const e of Object.values(S.board.E)){
    if(e.road!==null) continue;
    if(S.hasSea && edgeLand(S,e)<1) continue;   // roads need a land side
    if(fromVertex){ if(e.a===fromVertex||e.b===fromVertex) out.push(e.k); continue; }
    for(const end of [e.a,e.b]){
      const v=S.board.V[end];
      if(v.bld && v.bld.p===p.i){ out.push(e.k); break; }
      if(v.bld && v.bld.p!==p.i) continue; // cannot build through opponent building
      if(v.edges.some(k=>S.board.E[k].road===p.i)){ out.push(e.k); break; }
    }
  }
  return [...new Set(out)];
}
// Voyages edge classification
function edgeLand(S,e){ return e.hexes.filter(h=>S.board.hexes[h].terrain!=='sea').length; }
function edgeSea(S,e){ return e.hexes.filter(h=>S.board.hexes[h].terrain==='sea').length + (2-e.hexes.length); }
// legal ship placements: sea-bordering empty edges connected to your network
function shipSpots(S,p){
  if(!S.hasSea) return [];
  const out=[];
  for(const e of Object.values(S.board.E)){
    if(e.ship!=null||e.road!=null) continue;
    if(edgeSea(S,e)<1) continue;
    for(const end of [e.a,e.b]){
      const v=S.board.V[end];
      if(v.bld&&v.bld.p===p.i){ out.push(e.k); break; }
      if(v.bld&&v.bld.p!==p.i) continue;
      if(v.edges.some(k=>S.board.E[k].ship===p.i||S.board.E[k].road===p.i)){ out.push(e.k); break; }
    }
  }
  return [...new Set(out)];
}
function citySpots(S,p){
  return Object.values(S.board.V).filter(v=>v.bld&&v.bld.p===p.i&&v.bld.type==='sett').map(v=>v.k);
}
function portsOf(S,p){
  const set=new Set();
  for(const v of Object.values(S.board.V))
    if(v.bld&&v.bld.p===p.i&&v.port) set.add(v.port);
  return set;
}
function rateFor(S,p,res){
  const ports=portsOf(S,p);
  let rate = ports.has(res)?2 : ports.has('any')?3 : 4;
  // Trade Post: a building touching it grants 3:1 on anything
  if(rate>3 && S.hasTradepost){
    for(const v of Object.values(S.board.V))
      if(v.bld&&v.bld.p===p.i && v.hexes.some(hid=>S.board.hexes[hid].site==='tradepost')){ rate=3; break; }
  }
  return rate;
}

/* ---------------- mutations ---------------- */
function placeSett(S,p,vk,setup){
  const v=S.board.V[vk];
  v.bld={p:p.i,type:'sett'};
  p.stock.sett--;
  if(!setup){ pay(S,p,COST.sett); recomputeLongestRoad(S); }
  log(S,`<b>${p.name}</b> built a settlement`);
  // Wonders: first settlement touching a site claims it
  for(const hid of v.hexes){
    const h=S.board.hexes[hid];
    if(h.site==='ruins'&&!h.claimedBy){ h.claimedBy=p.i; for(const r of RES) if(S.bank[r]>0){ S.bank[r]--; p.res[r]++; } log(S,`<b>${p.name}</b> unearths the Ruins — +1 of each resource`,true); }
    else if(h.site==='monument'&&!h.claimedBy){ h.claimedBy=p.i; log(S,`<b>${p.name}</b> claims the Monument — +1 VP`,true); }
  }
}
function placeCity(S,p,vk){
  S.board.V[vk].bld={p:p.i,type:'city'};
  p.stock.city--; p.stock.sett++;
  pay(S,p,COST.city);
  log(S,`<b>${p.name}</b> upgraded to a city`);
}
function placeRoad(S,p,ek,free){
  S.board.E[ek].road=p.i;
  p.stock.road--;
  if(!free) pay(S,p,COST.road);
  recomputeLongestRoad(S);
  log(S,`<b>${p.name}</b> built a road`);
}
function placeShip(S,p,ek,free){
  S.board.E[ek].ship=p.i;
  p.stock.ship--;
  if(!free) pay(S,p,COST.ship);
  recomputeLongestRoad(S);
  log(S,`<b>${p.name}</b> set sail — built a ship`);
}
function grantSetupResources(S,p,vk){
  for(const hid of S.board.V[vk].hexes){
    const h=S.board.hexes[hid];
    if(h.terrain!=='desert'&&h.terrain){ const r=h.terrain; if(S.bank[r]>0){ S.bank[r]--; p.res[r]++; } }
  }
}

function rollDice(S){
  const d1=1+Math.floor(Math.random()*6), d2=1+Math.floor(Math.random()*6);
  S.dice=[d1,d2]; S.rolled=true;
  const total=d1+d2;
  log(S,`<b>${curP(S).name}</b> rolled <b>${total}</b>`,true);
  if(total===7){
    S.discardQueue=S.players.filter(p=>handSize(p)>7).map(p=>p.i);
    return {seven:true};
  }
  distribute(S,total);
  return {seven:false};
}
function distribute(S,total){
  const gains=S.players.map(()=>({wood:0,brick:0,sheep:0,wheat:0,ore:0}));
  const gold={};
  for(const h of S.board.hexes){
    if(h.num!==total || h.id===S.board.robber) continue;
    const cs=hexCorners(h.x,h.y);
    if(h.terrain==='gold'){
      for(const [x,y] of cs){ const v=S.board.V[vkey(x,y)]; if(v&&v.bld) gold[v.bld.p]=(gold[v.bld.p]||0)+(v.bld.type==='city'?2:1); }
      continue;
    }
    const res=h.terrain;
    for(const [x,y] of cs){
      const v=S.board.V[vkey(x,y)];
      if(v&&v.bld) gains[v.bld.p][res]+= v.bld.type==='city'?2:1;
    }
  }
  // bank shortage rule: if bank can't cover everyone for a resource, only a single claimant gets the remainder
  for(const r of RES){
    const want=gains.reduce((a,g)=>a+g[r],0);
    if(want===0) continue;
    const claimants=gains.filter(g=>g[r]>0).length;
    if(want>S.bank[r]&&claimants>1){ gains.forEach(g=>g[r]=0); log(S,`Bank is out of ${RES_META[r].label} — no one collects it`,true); continue; }
    for(const [pi,g] of gains.entries()){
      const give=Math.min(g[r],S.bank[r]);
      if(give>0){ S.bank[r]-=give; S.players[pi].res[r]+=give; g[r]=give; }
      else g[r]=0;
    }
  }
  S.lastGains=gains;
  for(const [pi,g] of gains.entries()){
    const parts=RES.filter(r=>g[r]>0).map(r=>`+${g[r]} ${RES_META[r].label}`);
    if(parts.length) log(S,`<b>${S.players[pi].name}</b> ${parts.join(', ')}`);
  }
  // Gold Field pays a wild — each affected player auto-takes their neediest from the bank
  for(const pi of Object.keys(gold)){
    if(+pi===0){ // human picks their gold at the start of their turn
      S.goldPending=(S.goldPending||0)+gold[pi];
      log(S,`<b>You</b> struck gold — choose your reward (+${gold[pi]})`);
    } else {
      const pl=S.players[pi]; let got=0;
      for(let k=0;k<gold[pi];k++){ const r=neediestResource(S,pl); if(r){ S.bank[r]--; pl.res[r]++; gains[pi][r]++; got++; } }
      if(got) log(S,`<b>${pl.name}</b> struck gold (+${got})`);
    }
  }
  // Volcano erupts on a big doubles roll (4-4 / 5-5 / 6-6, ~1 in 12) — the robber is
  // cast onto it, blocking it. Independent of the volcano's own number.
  if(S.dice && S.dice[0]===S.dice[1] && S.dice[0]>=4){
    const erupt=S.board.hexes.find(h=>h.volcano&&h.id!==S.board.robber);
    if(erupt){ S.board.robber=erupt.id; log(S,`The volcano erupts — the robber is cast onto it!`,true); }
  }
}

function moveRobber(S,hexId){
  S.board.robber=hexId;
  const h=S.board.hexes[hexId];
  log(S,`<b>${curP(S).name}</b> moved the robber`,true);
  // victims: players with buildings on this hex (excluding mover), with cards
  const cs=hexCorners(h.x,h.y);
  const victims=new Set();
  for(const [x,y] of cs){
    const v=S.board.V[vkey(x,y)];
    if(v&&v.bld&&v.bld.p!==curP(S).i){
      const t=S.players[v.bld.p];
      if(handSize(t)>0){
        if(S.settings.friendlyRobber && vp(S,t,false)<3) continue;
        victims.add(t.i);
      }
    }
  }
  return [...victims];
}
function steal(S,fromI){
  const thief=curP(S), victim=S.players[fromI];
  const pool=[];
  for(const r of RES) for(let i=0;i<victim.res[r];i++) pool.push(r);
  if(!pool.length) return null;
  const r=pool[Math.floor(Math.random()*pool.length)];
  victim.res[r]--; thief.res[r]++;
  log(S,`<b>${thief.name}</b> stole a card from <b>${victim.name}</b>`);
  return r;
}
function discard(S,p,sel){
  for(const [r,n] of Object.entries(sel)){ p.res[r]-=n; S.bank[r]+=n; }
  log(S,`<b>${p.name}</b> discarded ${sum(sel)} cards`);
  S.discardQueue=S.discardQueue.filter(i=>i!==p.i);
}

function buyDev(S,p){
  if(!S.devDeck.length) return null;
  pay(S,p,COST.dev);
  const c=S.devDeck.pop();
  if(c==='vp'){ p.devVp++; p.dev.push(c); }
  else p.newdev.push(c);
  log(S,`<b>${p.name}</b> bought a development card`);
  return c;
}
function playDev(S,p,card){
  p.dev.splice(p.dev.indexOf(card),1);
  p.playedDevThisTurn=true;
  log(S,`<b>${p.name}</b> played <b>${DEV_META[card].label}</b>`,true);
  if(card==='knight'){
    p.knights++;
    if(p.knights>=3&&p.knights>S.largestArmy.size){
      if(S.largestArmy.owner!==p.i){ S.largestArmy={owner:p.i,size:p.knights}; log(S,`<b>Largest Army</b> → <b>${p.name}</b> (${p.knights} knights)`,true); }
      else S.largestArmy.size=p.knights;
    }
  }
}
function monopoly(S,p,res){
  let got=0;
  for(const o of S.players){ if(o.i===p.i) continue; got+=o.res[res]; o.res[res]=0; }
  p.res[res]+=got;
  log(S,`<b>${p.name}</b> monopolized ${RES_META[res].label} (+${got})`);
}
function yearOfPlenty(S,p,r1,r2){
  for(const r of [r1,r2]) if(S.bank[r]>0){ S.bank[r]--; p.res[r]++; }
  log(S,`<b>${p.name}</b> took ${RES_META[r1].label} + ${RES_META[r2].label} from the bank`);
}
function bankTrade(S,p,give,get){
  const rate=rateFor(S,p,give);
  if(p.res[give]<rate||S.bank[get]<1) return false;
  p.res[give]-=rate; S.bank[give]+=rate;
  S.bank[get]--; p.res[get]++;
  log(S,`<b>${p.name}</b> traded ${rate} ${RES_META[give].label} → 1 ${RES_META[get].label}`);
  return true;
}
function playerTrade(S,a,b,give,get){
  for(const [r,n] of Object.entries(give)){ a.res[r]-=n; b.res[r]+=n; }
  for(const [r,n] of Object.entries(get)){ b.res[r]-=n; a.res[r]+=n; }
  log(S,`<b>${a.name}</b> traded with <b>${b.name}</b>`,true);
}

function endTurn(S){
  const p=curP(S);
  p.dev.push(...p.newdev); p.newdev=[];
  p.playedDevThisTurn=false;
  S.rolled=false; S.dice=null;
  S.turnPtr=(S.turnPtr+1)%S.players.length;
}

/* ---------------- longest road ---------------- */
function recomputeLongestRoad(S){
  const lens=S.players.map(p=>{ const l=longestRoadOf(S,p.i); p.roadLen=l; return l; });
  const cur=S.longestRoad.owner;
  if(cur!==null&&lens[cur]>=5){
    // holder keeps the card unless someone strictly exceeds them
    let owner=cur,len=lens[cur];
    for(const p of S.players) if(lens[p.i]>len){ owner=p.i; len=lens[p.i]; }
    if(owner!==cur) log(S,`<b>Longest Road</b> → <b>${S.players[owner].name}</b> (${len})`,true);
    S.longestRoad={owner,len};
  } else {
    // holder was cut below 5 (or no holder): award to unique max ≥5, else nobody
    const max=Math.max(...lens);
    const holders=S.players.filter(p=>lens[p.i]===max&&max>=5);
    if(holders.length===1){
      S.longestRoad={owner:holders[0].i,len:max};
      if(holders[0].i!==cur) log(S,`<b>Longest Road</b> → <b>${holders[0].name}</b> (${max})`,true);
    } else {
      if(cur!==null) log(S,`The <b>Longest Road</b> card is set aside`,true);
      S.longestRoad={owner:null,len:0};
    }
  }
}
function longestRoadOf(S,pi){
  const E=S.board.E,V=S.board.V;
  const mine=Object.values(E).filter(e=>e.road===pi||e.ship===pi);   // ships count toward the route
  let best=0;
  const walk=(vk,used,len)=>{
    best=Math.max(best,len);
    const v=V[vk];
    if(v.bld&&v.bld.p!==pi) return; // opponent building breaks the route
    for(const ek2 of v.edges){
      const e2=E[ek2];
      if((e2.road!==pi&&e2.ship!==pi)||used.has(ek2)) continue;
      used.add(ek2);
      walk(e2.a===vk?e2.b:e2.a,used,len+1);
      used.delete(ek2);
    }
  };
  for(const e of mine){
    for(const start of [e.a,e.b]){
      const used=new Set([e.k]);
      walk(e.a===start?e.b:e.a,used,1);
    }
  }
  return best;
}

/* ================= BOT AI ================= */
function noise(S){ return S.settings.difficulty==='casual'?2.2:S.settings.difficulty==='standard'?0.9:0.15; }

function vertexScore(S,vk,p){
  const v=S.board.V[vk];
  let pips=0; const kinds=new Set();
  for(const hid of v.hexes){
    const h=S.board.hexes[hid];
    if(h.num){ pips+=PIPS[h.num]; kinds.add(h.terrain); }
  }
  let s=pips + kinds.size*0.8;
  if(v.hexes.some(hid=>S.board.hexes[hid].terrain==='gold')) s+=1.6;   // Gold Fields are prime
  if(v.port==='any') s+=0.7; else if(v.port) s+=1.0;
  // diversity vs what the bot already produces
  if(p){
    const have=new Set();
    for(const vx of Object.values(S.board.V))
      if(vx.bld&&vx.bld.p===p.i) vx.hexes.forEach(h=>{const hx=S.board.hexes[h]; if(hx.num) have.add(hx.terrain);});
    for(const k of kinds) if(!have.has(k)) s+=0.9;
  }
  return s + (Math.random()-0.5)*noise(S);
}

function botSetupSett(S,p){
  const spots=settSpots(S,p,true);
  return spots.reduce((a,b)=>vertexScore(S,a,p)>=vertexScore(S,b,p)?a:b);
}
function botSetupRoad(S,p,vk){
  const opts=roadSpots(S,p,vk);
  // point road toward the best open nearby vertex
  let best=opts[0],bs=-1;
  for(const ek of opts){
    const e=S.board.E[ek];
    const far=e.a===vk?e.b:e.a;
    const s=Math.max(0,...S.board.V[far].adj.filter(k=>!S.board.V[k].bld).map(k=>vertexScore(S,k,p)));
    if(s>bs){bs=s;best=ek;}
  }
  return best;
}

function botDiscard(S,p){
  const n=Math.floor(handSize(p)/2);
  const sel={wood:0,brick:0,sheep:0,wheat:0,ore:0};
  const priority=r=>{ // keep what feeds the next build
    const want=canAfford(p,COST.city)||citySpots(S,p).length? {wheat:2,ore:3} : {wood:1,brick:1,sheep:1,wheat:1};
    return (want[r]||0);
  };
  for(let i=0;i<n;i++){
    let pick=null,bv=1e9;
    for(const r of RES){
      const left=p.res[r]-sel[r];
      if(left<=0) continue;
      const v=priority(r)*2 + (left<=1?1:0) + Math.random()*.3;
      if(v<bv){bv=v;pick=r;}
    }
    if(pick) sel[pick]++;
  }
  return sel;
}

function botRobberHex(S,p){
  const leader=S.players.filter(o=>o.i!==p.i).sort((a,b)=>vp(S,b,false)-vp(S,a,false))[0];
  let best=null,bs=-1;
  for(const h of S.board.hexes){
    if(h.id===S.board.robber||!h.num) continue;
    const cs=hexCorners(h.x,h.y);
    let score=0, mine=false, victims=false;
    for(const [x,y] of cs){
      const v=S.board.V[vkey(x,y)];
      if(v&&v.bld){
        const w=(v.bld.type==='city'?2:1)*PIPS[h.num];
        if(v.bld.p===p.i){ mine=true; }
        else{
          score+=w*(v.bld.p===leader.i?1.6:1);
          const t=S.players[v.bld.p];
          if(handSize(t)>0&&(!S.settings.friendlyRobber||vp(S,t,false)>=3)) victims=true;
        }
      }
    }
    if(mine) score-=6;
    if(victims) score+=1.5;
    score+=(Math.random()-.5)*noise(S);
    if(score>bs){bs=score;best=h.id;}
  }
  return best ?? S.board.hexes.find(h=>h.id!==S.board.robber).id;
}
function botStealTarget(S,victims){
  return victims.slice().sort((a,b)=>handSize(S.players[b])-handSize(S.players[a]))[0];
}

// what the bot still needs for its preferred build
function botNeeds(S,p){
  if(citySpots(S,p).length&&p.stock.city>0) return COST.city;
  if(settSpots(S,p,false).length&&p.stock.sett>0) return COST.sett;
  if(p.stock.sett>0&&p.stock.road>0) return {wood:1,brick:1};
  return COST.dev;
}

function botEvaluateOffer(S,p,give,get){
  // give/get from the *offerer's* perspective: bot receives `give`, pays `get`
  if(!Object.entries(get).every(([r,n])=>p.res[r]>=n)) return false;
  const needs=botNeeds(S,p);
  const val=r=>{
    const short=Math.max(0,(needs[r]||0)-p.res[r]);
    return 1+short*1.2+(p.res[r]===0?0.4:0)-(p.res[r]>=4?0.4:0);
  };
  let inV=0,outV=0;
  for(const [r,n] of Object.entries(give)) inV+=val(r)*n;
  for(const [r,n] of Object.entries(get)) outV+=val(r)*n;
  const bar=S.settings.difficulty==='casual'?-0.3:S.settings.difficulty==='standard'?0.15:0.5;
  // never help a player about to win
  const offerer=curP(S);
  if(vp(S,offerer,false)>=S.settings.target-2&&S.settings.difficulty!=='casual') return false;
  return inV-outV>bar;
}

// one bot "step": returns an action descriptor (for UI pacing) or null when done
function botStep(S,p){
  // 1) city
  if(canAfford(p,COST.city)&&p.stock.city>0){
    const spots=citySpots(S,p);
    if(spots.length){
      const vk=spots.reduce((a,b)=>vertexScore(S,a)>=vertexScore(S,b)?a:b);
      placeCity(S,p,vk); return {type:'city',vk};
    }
  }
  // 2) settlement
  if(canAfford(p,COST.sett)&&p.stock.sett>0){
    const spots=settSpots(S,p,false);
    if(spots.length){
      const vk=spots.reduce((a,b)=>vertexScore(S,a,p)>=vertexScore(S,b,p)?a:b);
      placeSett(S,p,vk,false); return {type:'sett',vk};
    }
  }
  // 3b) Voyages: sail a ship toward an open land vertex on another shore
  if(S.hasSea&&canAfford(p,COST.ship)&&p.stock.ship>0&&p.stock.sett>0){
    const sopts=shipSpots(S,p);
    let sbest=null,sbs=1.2;
    for(const ek of sopts){ const e=S.board.E[ek];
      for(const end of [e.a,e.b]){ const v=S.board.V[end];
        if(!v.bld&&!v.adj.some(k=>S.board.V[k].bld)&&v.hexes.some(hid=>S.board.hexes[hid].terrain!=='sea')){
          const s=vertexScore(S,end,p); if(s>sbs){sbs=s;sbest=ek;}
        }
      }
      if(!sbest&&Math.random()<0.15) sbest=ek;   // occasionally extend a route outward
    }
    if(sbest){ placeShip(S,p,sbest,false); return {type:'ship'}; }
  }
  // 3) road toward a good expansion (only if a sett is still worth chasing)
  if(canAfford(p,COST.road)&&p.stock.road>0&&p.stock.sett>0){
    const opts=roadSpots(S,p,null);
    if(opts.length){
      let best=null,bs=1.2; // must beat a threshold so bots don't spam roads
      for(const ek of opts){
        const e=S.board.E[ek];
        for(const end of [e.a,e.b]){
          const v=S.board.V[end];
          if(!v.bld&&!v.adj.some(k=>S.board.V[k].bld)){
            const s=vertexScore(S,end,p);
            if(s>bs){bs=s;best=ek;}
          }
        }
        // also extend toward open vertices two steps out
        if(!best&&Math.random()<0.2) best=ek;
      }
      const raceRoad = S.longestRoad.owner!==p.i && (p.roadLen||0)>=3 && Math.random()<0.5;
      if(best||raceRoad){
        placeRoad(S,p,best||opts[Math.floor(Math.random()*opts.length)],false);
        return {type:'road'};
      }
    }
  }
  // 4) buy dev
  if(canAfford(p,COST.dev)&&S.devDeck.length&&(S.settings.difficulty!=='casual'||Math.random()<.6)){
    buyDev(S,p); return {type:'dev'};
  }
  // 5) bank/port trade toward needs
  const needs=botNeeds(S,p);
  for(const want of RES){
    const short=(needs[want]||0)-p.res[want];
    if(short<=0) continue;
    for(const give of RES){
      if(needs[give]) continue;
      const rate=rateFor(S,p,give);
      if(p.res[give]>=rate+((needs[give]||0))){
        if(bankTrade(S,p,give,want)) return {type:'trade'};
      }
    }
  }
  return null;
}

function botMaybePlayDev(S,p){
  const playable=p.dev.filter(c=>c!=='vp');
  if(!playable.length||p.playedDevThisTurn) return null;
  // knight: play if robber is on us, or to push for largest army
  if(playable.includes('knight')){
    const onUs=(()=>{const h=S.board.hexes[S.board.robber];return hexCorners(h.x,h.y).some(([x,y])=>{const v=S.board.V[vkey(x,y)];return v&&v.bld&&v.bld.p===p.i;});})();
    if(onUs||p.knights+1>=Math.max(3,S.largestArmy.size+1)&&S.largestArmy.owner!==p.i&&Math.random()<.7){
      return 'knight';
    }
  }
  if(playable.includes('road')&&p.stock.road>=2) return 'road';
  if(playable.includes('plenty')) return 'plenty';
  if(playable.includes('mono')){
    // only if a resource we need is plentiful among others
    const needs=botNeeds(S,p);
    for(const r of RES){
      const around=S.players.filter(o=>o.i!==p.i).reduce((a,o)=>a+o.res[r],0);
      if((needs[r]||0)>0&&around>=3) return 'mono';
    }
  }
  return null;
}
function botMonopolyPick(S,p){
  let best='wheat',bv=-1;
  for(const r of RES){
    const around=S.players.filter(o=>o.i!==p.i).reduce((a,o)=>a+o.res[r],0);
    const v=around+((botNeeds(S,p)[r]||0)*1.5);
    if(v>bv){bv=v;best=r;}
  }
  return best;
}
function botPlentyPick(S,p){
  const needs=botNeeds(S,p);
  const picks=[];
  for(const r of RES){
    let short=Math.max(0,(needs[r]||0)-p.res[r]);
    while(short-->0&&picks.length<2) picks.push(r);
  }
  while(picks.length<2) picks.push(RES[Math.floor(Math.random()*5)]);
  return picks.slice(0,2);
}

<script>
/* ================= HEXHAVEN UI ================= */
'use strict';

const $=id=>document.getElementById(id);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};

/* crisp inline icon set — no emoji, consistent on every platform */
const ICONS={
  card:'<rect x="-8" y="-9" width="12" height="16" rx="2"/><rect x="-3" y="-7" width="12" height="16" rx="2"/>',
  scroll:'<path d="M-8 -8 h13 a3 3 0 0 1 3 3 v10 a3 3 0 0 1 -3 3 h-13 a3 3 0 0 1 -3 -3 v-10 a3 3 0 0 1 3 -3 z"/><path d="M-5 -3 h9 M-5 1 h9 M-5 5 h6"/>',
  sword:'<path d="M-7 7 L5 -5 M5 -5 L8 -8 M-2 2 L-6 -2 M2 -2 L6 2 M-7 7 L-9 9"/>',
  road:'<path d="M-8 8 L8 -8"/><path d="M-3 -2 L1 2" stroke-dasharray="2 3"/>',
  house:'<path d="M-7 8 V-1 L0 -8 L7 -1 V8 Z"/>',
  city:'<path d="M-9 8 V-2 L-4 -8 L1 -2 V0 H9 V8 Z"/>',
  die:'<rect x="-9" y="-9" width="18" height="18" rx="4"/><circle cx="-4" cy="-4" r="1.6" fill="currentColor" stroke="none"/><circle cx="4" cy="4" r="1.6" fill="currentColor" stroke="none"/><circle cx="0" cy="0" r="1.6" fill="currentColor" stroke="none"/>',
  gift:'<rect x="-8" y="-3" width="16" height="11" rx="1.5"/><path d="M0 -3 V8 M-8 -3 H8 M0 -3 C -6 -3 -6 -9 -2 -8 C 1 -7 0 -4 0 -3 C 0 -4 -1 -7 2 -8 C 6 -9 6 -3 0 -3"/>',
  gear:'<circle cx="0" cy="0" r="3.4"/><path d="M0 -9 V-6 M0 6 V9 M-9 0 H-6 M6 0 H9 M-6.4 -6.4 L-4.2 -4.2 M4.2 4.2 L6.4 6.4 M-6.4 6.4 L-4.2 4.2 M4.2 -4.2 L6.4 -6.4"/>',
  menu:'<path d="M-8 -5 H8 M-8 0 H8 M-8 5 H8"/>',
  ship:'<path d="M-8 4 L8 4 L5 9 L-5 9 Z"/><path d="M0 4 L0 -8 L6 -1 L0 0"/>',
  coins:'<circle cx="-3" cy="-3" r="5.5"/><path d="M2 -1 a5.5 5.5 0 1 1 -7 7"/>',
  rosette:'<circle cx="0" cy="0" r="5"/><path d="M0 -5 V-9 M0 5 V9 M-5 0 H-9 M5 0 H9 M-3.5 -3.5 L-6.4 -6.4 M3.5 3.5 L6.4 6.4 M-3.5 3.5 L-6.4 6.4 M3.5 -3.5 L6.4 -6.4"/>',
  flag:'<path d="M-6 9 V-9 M-6 -8 H7 L3 -4 L7 0 H-6"/>',
};
const icoGeo=(name,size)=>`<svg class="ig" width="${size}" height="${size}" viewBox="-12 -12 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
/* rich silhouettes from game-icons.net (see GI), geometric fallback for micro/chrome icons */
const gico=(name,size=16)=>`<svg class="ig" width="${size}" height="${size}" viewBox="0 0 512 512" aria-hidden="true">${GI[name].map(d=>`<path d="${d}" fill="currentColor"/>`).join('')}</svg>`;
const ico=(name,size=15)=> (size>=13&&GI[name]) ? gico(name,size) : icoGeo(name,size);
const DEV_ICO={knight:'sword',vp:'rosette',road:'road',plenty:'gift',mono:'coins'};
const rdot=(r,n)=>`<span class="rd"><i style="background:${RES_META[r].col}"></i>${n>1?`<b class="num">${n}</b>`:''}</span>`;
const resIconHTML=(r,size=22)=>gico(r,size);
const SAVE_KEY='hexhaven-save-v1', SET_KEY='hexhaven-settings-v1';

const DEFAULT_SETTINGS={
  name:'You', colorIdx:0, bots:3, difficulty:'standard', target:10,
  layout:'spiral', friendlyRobber:false, botTrades:true, speed:'normal',
  expWild:false, mapSize:2, expSea:false,
};
let settings=loadSettings();
// Expansions are dev-only for now. Unlocked by ?dev (also ?developer, or #dev) in the URL.
// The unlock sticks in localStorage, so a query string lost to a redirect (GitHub Pages
// bounces /hexhaven?dev to /hexhaven/ and drops it) can't silently re-lock them.
// Clear it with ?dev=off.
const DEV_KEY='hexhaven-dev-v1';
const DEV=(()=>{
  const q=(location.search+' '+location.hash).toLowerCase();
  try{
    if(/[?&#]dev(eloper)?\b\s*=\s*(0|off|false|no)\b/.test(q)){ localStorage.removeItem(DEV_KEY); return false; }
    if(/[?&#]dev(eloper)?\b/.test(q)){ localStorage.setItem(DEV_KEY,'1'); return true; }
    return localStorage.getItem(DEV_KEY)==='1';
  }catch(e){ return /[?&#]dev(eloper)?\b/.test(q); }   // private mode: URL only
})();
let S=null;            // game state
let mode=null;         // board interaction mode
let botTimer=null;
let pendingRoadFrom=null; // setup: vertex the road must attach to

function loadSettings(){
  try{ return {...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(SET_KEY)||'{}')}; }
  catch(e){ return {...DEFAULT_SETTINGS}; }
}
function saveSettings(){ try{localStorage.setItem(SET_KEY,JSON.stringify(settings));}catch(e){} }
function saveGame(){ try{ if(S&&S.phase!=='over') localStorage.setItem(SAVE_KEY,JSON.stringify(S)); else localStorage.removeItem(SAVE_KEY);}catch(e){} }
function hasSave(){ try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;} }

const SPEEDS={relaxed:900,normal:520,fast:220};
const tick=()=>SPEEDS[S?.settings?.speed||settings.speed]||520;

/* ---------------- 3D board glue ---------------- */
const W_K=(0.5*1.02)/56;                 // engine px -> world units (matches hex-board)
const toWorld=(x,y)=>[x*W_K,y*W_K];
let board=null, pendingState=null;
let engineReady=false, boardReady=false, loadDone=false, panelsHidden=false;
let screen='loading';
let draft=null, fromMenuNew=true;
const flashRes=new Set();
let diceAnimate=false, lastLogLen=-1, idleTimer=null;

function attachBoard(b){
  board=b; boardReady=true;
  if(pendingState){ board.setState(pendingState); pendingState=null; }
  setLoad('board');
}
document.addEventListener('hex-board-ready',e=>attachBoard(e.detail));

function boardNewIsland(st){ if(board) board.setState(st); else pendingState=st; }
function boardRefresh(){ if(board) board.refresh(); }
function boardPulse(){ if(board&&S&&S.dice) board.pulse(S.dice[0]+S.dice[1]); }
function afterAnyRoll(){
  boardPulse(); diceAnimate=true; flashRes.clear();
  if(S.dice && S.dice[0]+S.dice[1]!==7){
    const g=S.lastGains&&S.lastGains[0];
    if(g) for(const r of RES) if(g[r]>0) flashRes.add(r);
  }
}

const MENU_VIEW=[420,60,-210];
function gameView(){
  // board-first: one thin bar at the bottom, thin rail on top. Reserve their
  // heights (top rail + command bar) so the island frames itself in between.
  const h=innerHeight;
  const dock=document.getElementById("dock");
  const collapsed=dock&&dock.classList.contains("collapsed");
  const bar=collapsed?54:(h<=560?92:118);   // command-bar footprint
  return [0, 84 + bar, 0];                    // 84 ≈ top rail + breathing room
}
function setDockCollapsed(on){ const d=$("dock"); if(!d)return; d.classList.toggle("collapsed",on); if(screen==="game") setView(panelsHidden?[0,0,0]:gameView()); }
function initDock(){
  const handle=$("dock-handle"); if(!handle) return;
  let sy=0,dy=0,active=false;
  handle.addEventListener("pointerdown",e=>{active=true;sy=e.clientY;dy=0;try{handle.setPointerCapture(e.pointerId);}catch(_){}}); 
  handle.addEventListener("pointermove",e=>{ if(active) dy=e.clientY-sy; });
  const end=()=>{ if(!active)return; active=false; if(dy>26) setDockCollapsed(true); else if(dy<-26) setDockCollapsed(false); else setDockCollapsed(!$("dock").classList.contains("collapsed")); };
  handle.addEventListener("pointerup",end); handle.addEventListener("pointercancel",end);
}
function menuView(){ return innerWidth<820 ? [0,0,0] : MENU_VIEW; }
function setView(v){ if(board) board.setPanels(v[0],v[1],v[2]); }

/* ---------------- screens ---------------- */
function show(name){
  screen=name;
  document.body.dataset.screen=name;
  if(name==='menu'){ setView(menuView()); refreshMenu(); }
  else if(name==='setup') setView(menuView());
  else if(name==='game') setView(panelsHidden?[0,0,0]:gameView());
}

/* ---------------- loading ---------------- */
function setLoad(flag){
  if(flag==='engine') engineReady=true;
  if(flag==='board') boardReady=true;
  const bar=$('load-bar'), st=$('load-status');
  let pct=14, msg='Waking the engine';
  if(engineReady){ pct=58; msg='Raising the island'; }
  if(engineReady&&boardReady){ pct=100; msg='Ready'; }
  if(bar) bar.style.width=pct+'%';
  if(st) st.textContent=msg;
  if(engineReady&&boardReady&&!loadDone){
    loadDone=true;
    try{ boardNewIsland(newGame({...settings})); }catch(e){}
    setTimeout(()=>show('menu'),620);
  }
}

function boot(){
  document.body.dataset.screen='loading';
  if(DEV) document.body.dataset.dev='1';   // brass DEV badge on menu + setup
  $('btn-new').onclick=()=>showSetup(true);
  $('btn-continue').onclick=()=>{ try{ S=JSON.parse(localStorage.getItem(SAVE_KEY)); if(!S) return; boardNewIsland(S); startResume(); }catch(e){} };
  $('btn-settings').onclick=()=>showSetup(false);
  $('btn-rules').onclick=openRules;
  $('g-menu').onclick=(e)=>{ e.stopPropagation(); closePop('buildpop'); togglePop('gamemenu'); };
  $('btn-tomenu').onclick=()=>{ closePops(); stopBots(); saveGame(); show('menu'); };
  $('btn-new-island').onclick=()=>{ closePops(); showSetup(true); };
  $('btn-rules-g').onclick=()=>{ closePops(); openRules(); };
  $('btn-hide').onclick=()=>{ closePops(); togglePanels(); };
  $('btn-build').onclick=(e)=>{ e.stopPropagation(); closePop('gamemenu'); togglePop('buildpop'); };
  $('setup-back').onclick=()=>show('menu');
  $('log').onclick=()=>$('log').classList.toggle('open');
  // any tap on the island (or elsewhere) dismisses open popovers
  document.getElementById('board3d').addEventListener('pointerdown',closePops);
  if(window.__hexBoard) attachBoard(window.__hexBoard);
  initDock();
  let rzT; window.addEventListener("resize",()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(screen==="game") setView(panelsHidden?[0,0,0]:gameView()); else if(screen==="menu"||screen==="setup") setView(menuView()); },160); });
  setLoad('engine');
}
function startResume(){
  panelsHidden=false; document.body.classList.remove('panels-hidden');
  show('game'); renderAll(); advance();
}
function refreshMenu(){ const has=hasSave(); $('btn-continue').disabled=!has; $('btn-continue').style.opacity=has?'1':'.4'; }

function togglePanels(){
  panelsHidden=!panelsHidden;
  document.body.classList.toggle('panels-hidden',panelsHidden);
  $('btn-hide').textContent=panelsHidden?'Show board':'Focus mode';
  setView(panelsHidden?[0,0,0]:gameView());
}

/* lightweight popovers (game menu + build tray) */
function closePop(id){ const p=$(id); if(p) p.hidden=true; }
function closePops(){ closePop('gamemenu'); closePop('buildpop'); }
function togglePop(id){ const p=$(id); if(p) p.hidden=!p.hidden; }

/* ---------------- setup screen ---------------- */
function showSetup(fromNew){
  fromMenuNew=fromNew;
  draft={...settings};
  if(!DEV){ draft.expWild=false; draft.expSea=false; }   // expansions off for players
  $('setup-sub').textContent=fromNew?'Then deal yourself in.':'Applies to your next island.';
  $('setup-go').textContent=fromNew?'Start game':'Save and start';
  renderSetup();
  show('setup');
  reDeal();
}
function reDeal(){ try{ boardNewIsland(newGame({...draft})); }catch(e){} }
function renderSetup(){
  const s=draft;
  $('setup-body').innerHTML=`
    <div><div class="field-lab">Your name</div><input type="text" id="set-name" maxlength="14" value="${s.name.replace(/"/g,'&quot;')}"></div>
    <div><div class="field-lab">Your colour</div><div class="swatches" id="set-colors">${PLAYER_COLORS.map((c,i)=>`<button class="swatch ${i===s.colorIdx?'on':''}" data-i="${i}" style="background:${c.hex}" aria-label="${c.id}"></button>`).join('')}</div></div>
    <div><div class="field-lab">Rivals</div>${seg('bots',[{v:1,l:'1'},{v:2,l:'2'},{v:3,l:'3'}],s.bots)}</div>
    <div><div class="field-lab">Bot skill</div>${seg('difficulty',[{v:'casual',l:'Casual'},{v:'standard',l:'Standard'},{v:'cutthroat',l:'Cutthroat'}],s.difficulty)}</div>
    <div><div class="field-lab">Points to win</div>${seg('target',[{v:8,l:'8'},{v:10,l:'10'},{v:12,l:'12'}],s.target)}</div>

    <div><div class="field-lab">Voyages<small>Splits the map into two islands — build ships across the sea (wood + sheep)</small></div>${seg('expSea',[{v:false,l:'Off'},{v:true,l:'On'}],s.expSea)}</div>`:''}`;
  $('setup-body').querySelectorAll('[data-seg]').forEach(g=>{
    g.querySelectorAll('button').forEach(b=>b.onclick=()=>{

/* ---------------- game start ---------------- */
function startGame(){
  stopBots();
  S=newGame({...settings});
  boardNewIsland(S);
  log(S,`A new island rises. First to <b>${S.settings.target} VP</b> wins.`,true);
  const first=S.players[S.setupQueue[0]];
  log(S,`<b>${first.name}</b> places first`,true);
  panelsHidden=false; document.body.classList.remove('panels-hidden');
  show('game');
  renderAll(); saveGame();
  advance();
}

/* ---------------- central driver ---------------- */
function advance(){
  if(!S||S.phase==='over'){ if(S&&S.phase==='over') showGameOver(); return; }
  saveGame();

  // pending discards (7 rolled)
  if(S.discardQueue.length){
    const pi=S.discardQueue[0], p=S.players[pi];
    if(p.bot){
      discard(S,p,botDiscard(S,p));
      renderAll();
      setTimeout(advance,tick()/2);
    } else openDiscard(p);
    return;
  }
  if(S.afterSeven){ // robber must move
    S.afterSeven=false;
    beginRobber();
    return;
  }

  const p=curP(S);
  if(S.phase==='setup'){
    if(p.bot) queueBot(()=>botSetupMove());
    else beginPlayerSetup();
    return;
  }
  if(S.phase==='play'){
    if(p.bot) queueBot(()=>botTurn());
    else beginPlayerTurn();
  }
}
function queueBot(fn){ stopBots(); botTimer=setTimeout(fn,tick()); }
function stopBots(){ if(botTimer){clearTimeout(botTimer);botTimer=null;} }

/* ---------------- setup phase ---------------- */
function beginPlayerSetup(){
  if(S.setupStep==='sett'){
    mode='setup-sett';
    hint('Tap a corner to place your settlement');
  } else {
    mode='setup-road';
    hint('Tap an edge to place your road');
  }
  renderAll();
}
function botSetupMove(){
  const p=curP(S);
  if(S.setupStep==='sett'){
    const vk=botSetupSett(S,p);
    doSetupSett(p,vk);
  } else {
    const ek=botSetupRoad(S,p,S.lastSetupSett);
    doSetupRoad(p,ek);
  }
}
function doSetupSett(p,vk){
  placeSett(S,p,vk,true);
  S.lastSetupSett=vk;
  const round2=S.setupQueue.length<=S.players.length;
  if(round2) grantSetupResources(S,p,vk);
  S.setupStep='road';
  mode=null; renderAll();
  setTimeout(advance, p.bot?tick():0);
}
function doSetupRoad(p,ek){
  placeRoad(S,p,ek,true);
  S.setupQueue.shift();
  S.setupStep='sett'; S.lastSetupSett=null;
  mode=null;
  if(!S.setupQueue.length){
    S.phase='play'; S.turnPtr=0;
    log(S,`The founding is complete — <b>${curP(S).name}</b> opens play`,true);
  }
  renderAll();
  setTimeout(advance, p.bot?tick():0);
}

/* ---------------- player turn ---------------- */
function beginPlayerTurn(){
  mode=null;
  if(S.goldPending>0){ openGoldChooser(S.goldPending); return; }
  hint(S.rolled?'Build, trade, or end your turn':'Roll the dice');
  renderAll();
}
function openGoldChooser(n){
  $('overlay').dataset.lock='1';
  const picks=[];
  const bankFree=r=>S.bank[r]-picks.filter(x=>x===r).length>0;
  openSheet(`<h2>Gold Field</h2><div class="sub">Choose ${n} resource${n>1?'s':''} to take from the bank.</div>${resChoiceGrid('gold')}
    <div class="sheet-actions"><button class="btn primary" id="gold-ok" disabled>Take</button></div>`);
  const refresh=()=>{
    $('gold-ok').disabled=picks.length!==n;
    $('gold-ok').textContent=`Take (${picks.length}/${n})`;
    $('gold').querySelectorAll('.choice').forEach(b=>{
      const r=b.dataset.r, c=picks.filter(x=>x===r).length;
      b.classList.toggle('on',c>0);
      b.disabled=c===0&&!bankFree(r);
      b.innerHTML=`<span class="ic">${resIconHTML(r,24)}</span>${RES_META[r].label}${c?` ×${c}`:''}`;
    });
  };
  $('gold').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    const r=b.dataset.r, c=picks.filter(x=>x===r).length;
    if(picks.length<n&&bankFree(r)) picks.push(r);
    else if(c>0) picks.splice(picks.indexOf(r),1);
    refresh();
  });
  $('gold-ok').onclick=()=>{
    for(const r of picks){ S.bank[r]--; S.players[0].res[r]++; }
    S.goldPending=0; $('overlay').dataset.lock=''; closeSheet();
    flashRes.clear(); for(const r of picks) flashRes.add(r);
    beginPlayerTurn();
  };
  refresh();
}
function onRoll(){
  if(S.phase!=='play'||curP(S).bot||S.rolled) return;
  animateDice();
  const r=rollDice(S); afterAnyRoll();
  renderAll();
  if(r.seven){ S.afterSeven=true; setTimeout(advance,tick()); }
  else { hint('Build, trade, or end your turn'); if(S.goldPending>0) openGoldChooser(S.goldPending); }
  saveGame();
}
function beginRobber(){
  const p=curP(S);
  if(p.bot){
    const hid=botRobberHex(S,p);
    const victims=moveRobber(S,hid);
    if(victims.length){ steal(S,botStealTarget(S,victims)); }
    renderAll();
    setTimeout(()=>{ afterRobber(); },tick());
  } else {
    mode='robber';
    hint('Move the robber: tap a tile');
    renderAll();
  }
}
function afterRobber(){
  const p=curP(S);
  if(!S.rolled&&S.phase==='play'){ // knight was played before rolling
    if(p.bot){ /* bot continues its turn in botTurn flow */ }
  }
  if(p.bot){ queueBot(()=>botTurn(true)); }
  else { mode=null; beginPlayerTurn(); }
}
function onHexTap(hid){
  if(mode!=='robber'||hid===S.board.robber) return;
  const victims=moveRobber(S,hid);
  mode=null; renderAll();
  if(victims.length===1){ steal(S,victims[0]); renderAll(); afterRobberPlayer(); }
  else if(victims.length>1) openStealPicker(victims);
  else afterRobberPlayer();
}
function afterRobberPlayer(){
  saveGame();
  if(!S.rolled) hint('Roll the dice');
  else hint('Build, trade, or end your turn');
  renderAll();
}
function openStealPicker(victims){
  $('overlay').dataset.lock='1';
  openSheet(`
    <h2>Steal from…</h2>
    <div class="sub">Pick a rival on that tile.</div>
    <div class="partner-list">${victims.map(i=>{
      const p=S.players[i];
      return `<button class="partner" data-i="${i}"><span class="dot" style="background:${p.color}"></span><b>${p.name}</b><span class="st num">${handSize(p)} cards</span></button>`;
    }).join('')}</div>`);
  $('sheet').querySelectorAll('.partner').forEach(b=>b.onclick=()=>{
    steal(S,+b.dataset.i);
    $('overlay').dataset.lock=''; closeSheet(); renderAll(); afterRobberPlayer();
  });
}

/* build modes */
function toggleMode(m){
  if(curP(S).bot) return;
  const ab=$("act-"+m);
  if(ab&&ab.classList.contains("off")){ hint(ab.dataset.reason||"Not available right now.",true); return; }
  if(!S.rolled) return;
  mode = mode===m?null:m;
  if(mode==='road') hint(S.freeRoads>0?`Free roads left: ${S.freeRoads} — tap an edge`:'Tap an edge to build a road');
  if(mode==='ship') hint('Tap a sea edge to set sail');
  if(mode==='sett') hint('Tap a highlighted corner to build a settlement');
  if(mode==='city') hint('Tap one of your settlements to upgrade');
  if(!mode) hint('Build, trade, or end your turn');
  if(mode) closePops();   // clear the tray so the island is visible for placement
  renderAll();
}
function onVertexTap(vk){
  const p=curP(S);
  if(mode==='setup-sett'){ if(settSpots(S,p,true).includes(vk)) doSetupSett(p,vk); return; }
  if(mode==='sett'&&settSpots(S,p,false).includes(vk)&&canAfford(p,COST.sett)&&p.stock.sett>0){
    placeSett(S,p,vk,false); mode=null; renderAll(); winOrContinue();
  }
  if(mode==='city'&&citySpots(S,p).includes(vk)&&canAfford(p,COST.city)&&p.stock.city>0){
    placeCity(S,p,vk); mode=null; renderAll(); winOrContinue();
  }
}
function onEdgeTap(ek){
  const p=curP(S);
  if(mode==='setup-road'){ if(roadSpots(S,p,S.lastSetupSett).includes(ek)) doSetupRoad(p,ek); return; }
  if(mode==='road'&&roadSpots(S,p,null).includes(ek)&&p.stock.road>0){
    if(S.freeRoads>0){
      placeRoad(S,p,ek,true); S.freeRoads--;
      if(S.freeRoads<=0){ mode=null; hint('Build, trade, or end your turn'); }
      else hint(`Free roads left: ${S.freeRoads}`);
      renderAll(); winOrContinue(true);
    } else if(canAfford(p,COST.road)){
      placeRoad(S,p,ek,false);
      if(!canAfford(p,COST.road)) mode=null;
      renderAll(); winOrContinue(true);
    }
  }
  if(mode==='ship'&&shipSpots(S,p).includes(ek)&&p.stock.ship>0&&canAfford(p,COST.ship)){
    placeShip(S,p,ek,false);
    if(!canAfford(p,COST.ship)) mode=null;
    renderAll(); winOrContinue(true);
  }
}
function winOrContinue(stayInMode){
  saveGame();
  if(checkWin(S)){ renderAll(); showGameOver(); return; }
  if(!stayInMode) mode=null;
  renderAll();
}

/* dev cards */
function onBuyDev(){
  const p=curP(S);
  if(p.bot) return;
  const ab=$("act-dev");
  if(ab.classList.contains("off")){ hint(ab.dataset.reason||"Not available right now.",true); return; }
  if(!S.rolled||!canAfford(p,COST.dev)||!S.devDeck.length) return;
  const c=buyDev(S,p);
  hint(`You drew: ${DEV_META[c].label}`);
  closePops();
  renderAll(); winOrContinue();
}
function onPlayDev(card){
  const p=curP(S);
  if(p.bot||p.playedDevThisTurn||!p.dev.includes(card)||card==='vp') return;
  closePops();
  if(!S.rolled&&card!=='knight') return; // only knight may be played before rolling
  if(card==='knight'){ playDev(S,p,card); renderAll(); if(checkWin(S)){showGameOver();return;} beginRobber(); return; }
  if(card==='road'){
    playDev(S,p,card);
    S.freeRoads=Math.min(2,p.stock.road);
    mode='road'; hint(`Free roads left: ${S.freeRoads} — tap an edge`);
    renderAll(); return;
  }
  if(card==='plenty'){ openPlentyPicker(p); return; }
  if(card==='mono'){ openMonoPicker(p); return; }
}
function resChoiceGrid(id,multi){
  return `<div class="choice-grid" id="${id}">${RES.map(r=>`<button class="choice" data-r="${r}"><span class="ic">${resIconHTML(r,24)}</span>${RES_META[r].label}</button>`).join('')}</div>`;
}
function openPlentyPicker(p){
  $('overlay').dataset.lock='1';
  const picks=[];
  openSheet(`<h2>Year of Plenty</h2><div class="sub">Take any two resources from the bank.</div>
    ${resChoiceGrid('yop')}<div class="sheet-actions">
    <button class="btn ghost" id="yop-cancel">Cancel</button>
    <button class="btn primary" id="yop-ok" disabled>Take cards</button></div>`);
  const refresh=()=>{ $('yop-ok').disabled=picks.length!==2;
    $('yop').querySelectorAll('.choice').forEach(b=>{
      const n=picks.filter(x=>x===b.dataset.r).length;
      b.classList.toggle('on',n>0);
      b.innerHTML=`<span class="ic">${resIconHTML(b.dataset.r,24)}</span>${RES_META[b.dataset.r].label}${n?` ×${n}`:''}`;
    });};
  $('yop').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    const r=b.dataset.r;
    const n=picks.filter(x=>x===r).length;
    if(n>0&&picks.length>=2){ picks.splice(picks.indexOf(r),1); }
    else if(picks.length<2&&S.bank[r]>picks.filter(x=>x===r).length) picks.push(r);
    else if(n>0) picks.splice(picks.indexOf(r),1);
    refresh();
  });
  $('yop-cancel').onclick=()=>{ $('overlay').dataset.lock=''; closeSheet(); };
  $('yop-ok').onclick=()=>{
    playDev(S,p,'plenty'); yearOfPlenty(S,p,picks[0],picks[1]);
    $('overlay').dataset.lock=''; closeSheet(); renderAll(); winOrContinue();
